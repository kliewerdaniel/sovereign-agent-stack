name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/

      - name: Type check
        if: matrix.python-version == '3.11'
        run: mypy src/sas/ --ignore-missing-imports

      - name: Test
        run: |
          python -m pytest tests/unit/ tests/integration/test_quant_pipeline.py \
            -q --tb=short \
            --ignore=tests/integration/test_rust_extension.py
